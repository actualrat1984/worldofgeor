<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Audio Library — World of Ge'or</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css" />
  <link rel="stylesheet" href="/article-layouts.css" />
  <link rel="stylesheet" href="/archive-compass.css" />
</head>
<body class="font-sans">
  <div class="tl-shell">
    <header class="border-b border-gold/10 bg-ink/80 backdrop-blur">
      <div class="max-w-[1120px] mx-auto px-5 h-16 flex items-center justify-between gap-4">
        <a href="/" class="font-display text-xs tracking-[.2em]">WORLD OF GE'OR</a>
        <nav class="flex items-center gap-2" aria-label="Archive navigation"><a href="/wiki/" class="text-xs border border-gold/20 rounded-full px-3 py-2">WIKI</a><a href="/map-editor" class="text-xs border border-gold/20 rounded-full px-3 py-2">ATLAS STUDIO</a><a href="/dashboard" class="text-xs bg-gold text-ink rounded-full px-4 py-2 font-semibold">DASHBOARD</a></nav>
      </div>
    </header>
    <main class="max-w-[1120px] mx-auto px-5 py-12 md:py-16">
      <div class="text-center max-w-[700px] mx-auto">
        <p class="text-gold text-[10px] tracking-[.3em] font-semibold">THE LISTENING ROOM • PRIVATE</p>
        <h1 class="font-display text-3xl md:text-5xl font-bold mt-3">AUDIO LIBRARY</h1>
        <p class="font-serif italic text-xl text-cream/60 mt-3">The story of Ge'or, told in voice — chapter by chapter.</p>
        <p class="mt-4 flex items-center justify-center gap-3 flex-wrap">
          <span id="audioCount" role="status" class="text-xs text-cream/40">Tuning the room…</span>
        </p>
      </div>
      <section aria-label="Now playing" class="mt-9 rounded-xl border border-gold/10 p-5">
        <div class="flex items-baseline justify-between gap-3 flex-wrap">
          <h2 class="font-display text-sm tracking-[.2em] text-gold">NOW PLAYING</h2>
          <span id="audioPosition" class="text-[10px] tracking-widest text-cream/40"></span>
        </div>
        <p id="nowPlaying" class="mt-2 text-sm text-cream/80">Choose a chapter below.</p>
        <audio id="player" class="mt-4 w-full" controls preload="none"></audio>
        <p id="audioStatus" role="status" aria-live="polite" class="text-xs text-cream/40 mt-3">Tuning the room…</p>
        <div class="mt-4 flex items-center gap-3 flex-wrap">
          <button id="audioPrev" type="button" class="text-xs border border-gold/25 text-gold rounded-full px-5 py-2.5">← PREV</button>
          <button id="audioNext" type="button" class="text-xs border border-gold/25 text-gold rounded-full px-5 py-2.5">NEXT →</button>
        </div>
      </section>
      <div id="trackList" aria-busy="true" class="mt-8 grid gap-2">
        <p class="p-5 text-sm text-cream/40">Tuning the room…</p>
      </div>
      <footer class="mt-12 text-center">
        <p class="text-[10px] tracking-[.25em] text-cream/30">PRIVATE ARCHIVE · MIKHAIL &amp; ICHI</p>
        <a href="/dashboard" class="inline-flex mt-4 border border-gold/25 text-gold rounded-full px-5 py-2 text-xs tracking-widest">BACK TO MEMBER HOME</a>
      </footer>
    </main>
  </div>
  <script type="module" src="/audio.js"></script>
  <script type="module" src="/archive-compass.js"></script>
</body>
</html>
